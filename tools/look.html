<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bonnie Bounce — a closer look</title>
<style>body { margin: 0; background: #7fb8e8; } canvas#screen { display: none; } #out { image-rendering: pixelated; }</style>
</head>
<body>
<!-- A dev tool: a few players' frames side by side, big, to check a face
     or an outfit closely. /tools/look.html?who=winnie,ollie&k=idle,cheer
     (&z= zoom, default 8; &s=1 for the small frames; &save=name saves it
     to tools/reel/out/ when served by tools/reel/serve.js). -->
<canvas id="screen" width="160" height="144"></canvas>
<canvas id="out"></canvas>
<script src="../js/core.js"></script>
<script src="../js/art.js"></script>
<script src="../js/creatures.js"></script>
<script src="../js/creaturesx.js"></script>
<script src="../js/family.js"></script>
<script>
  var q = function (k, d) { var m = new RegExp('[?&]' + k + '=([^&]+)').exec(location.search); return m ? decodeURIComponent(m[1]) : d; };
  var A = BB.ART, Z = +q('z', 8), who = q('who', 'bonnie,beau,winnie,ollie,grace,lucy,luke').split(','), ks = q('k', 'idle,cheer').split(','), sz = q('s', '') ? 's' : 'b';
  var items = [];
  // &e=sprout,gus: every frame of those creatures (BB.ART.en), instead of players
  var flatten = function (v) { if (!v) return; if (v.rows) items.push(v); else if (Array.isArray(v)) v.forEach(flatten); else Object.keys(v).forEach(function (k) { flatten(v[k]); }); };
  if (q('e', '')) { q('e', '').split(',').forEach(function (k) { flatten(A.en[k] || A[k]); }); who = []; }
  who.forEach(function (w) {
    ks.forEach(function (k) {
      if (k === 'cameo') { if (A.family[w]) items.push(A.family[w].idle); return; }
      if (k === 'wave' || k === 'ccheer') { if (A.family[w]) items.push(k === 'wave' ? A.family[w].wave[0] : A.family[w].cheer); return; }
      // (school, kit: that outfit's own frames, in its colours: &k=school)
      if (k === 'school' || k === 'kit') { var Kt = A.player(w).kits[k][sz]; items.push({ sp: Kt.idle, v: BB.variant('look-' + k, k === 'kit' ? { b: '#da1f2b', B: '#9a1220', y: '#ffffff', Y: '#1c1c24', k: '#f4f4fa', K: '#c8ccd8', g: '#1c1c24', G: '#0c0c12', z: '#24202c', Z: '#f4f4fa' } : { b: '#1f5c34', B: '#123c22', k: '#7c808a', K: '#565a64', z: '#24202c', Z: '#3a3440' }) }); return; }
      var P = A.player(w); if (P[sz][k]) items.push(P[sz][k]);
    });
  });
  items = items.map(function (it) { return it.sp ? it : { sp: it, v: null }; });
  var W = items.reduce(function (a, s) { return a + s.sp.w + 3; }, 3), H = items.reduce(function (a, s) { return Math.max(a, s.sp.h); }, 0) + 6;
  var cv = document.getElementById('out'), g = cv.getContext('2d');
  cv.width = W * Z; cv.height = H * Z; g.imageSmoothingEnabled = false;
  g.fillStyle = '#7fb8e8'; g.fillRect(0, 0, cv.width, cv.height);
  var x = 3; items.forEach(function (it) { var s = it.sp; BB.draw(g, s, x * Z, (H - 3 - s.h) * Z, false, it.v, Z); x += s.w + 3; });
  var save = q('save', '');
  if (save) cv.toBlob(function (b) { fetch('/reel/frame?i=' + save, { method: 'POST', body: b }).then(function () { document.title = 'saved ' + save; }); });
</script>
</body>
</html>
