<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bonnie Bounce Christmas — app icon</title>
<style>
  body { margin: 0; background: #2a2440; color: #fff; font: 13px system-ui; padding: 16px; }
  canvas#screen { display: none; }
  .row { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; }
  figure canvas { display: block; border-radius: 22%; box-shadow: 0 6px 20px rgba(0,0,0,.4); margin-bottom: 8px; }
  a { color: #ffe048; }
</style>
</head>
<body>
<!-- A dev tool: draws the home-screen icon from the game's own Bonnie sprite
     (Christmas: a snowy night, and a Santa hat), so the icon always matches
     the game. Open via the preview server:
     /tools/icon.html — then save each size into icons/ with its link
     (icon-512.png, icon-192.png, icon-180.png). -->
<canvas id="screen" width="160" height="144"></canvas>
<div id="pad" style="display:none"><div data-dpad></div></div>
<div class="row" id="out"></div>
<script src="../js/core.js"></script>
<script src="../js/art.js"></script>
<script>
  var A = BB.ART;
  /* one design, drawn on a 64-pixel grid and scaled up whole, so every
     size stays crisp pixel art: Christmas Eve — a deep blue night sky,
     falling snow, a big moon, a snowy hill with a little fir — and Bonnie
     with Beau and Winnie, close up in Santa hats (an icon is seen at
     thumbnail size, so their faces fill it) */
  var paintIcon = function (size) {
    var c = document.createElement('canvas'); c.width = c.height = size;
    var g = c.getContext('2d'), u = size / 64;
    g.imageSmoothingEnabled = false;
    var px = function (x, y, w, h, col) { g.fillStyle = col; g.fillRect(Math.round(x * u), Math.round(y * u), Math.ceil(w * u), Math.ceil(h * u)); };
    var disc = function (cx, cy, r, col) { for (var y = -r; y < r; y++) { var hw = Math.round(Math.sqrt(r * r - (y + 0.5) * (y + 0.5))); px(cx - hw, cy + y, hw * 2, 1, col); } };
    // the night sky, banded the way the game's skies are
    ['#16184a', '#1c2260', '#242c74', '#2c3888', '#36469a', '#4258aa', '#5068b6', '#6278c0', '#7488c8'].forEach(function (col, i) { px(0, i * 7, 64, 7, col); });
    // the moon, with soft rings
    disc(51, 12, 12, 'rgba(255,255,255,0.10)'); disc(51, 12, 9, 'rgba(255,248,220,0.25)'); disc(51, 12, 6, '#fff6d8'); disc(49, 10, 2, '#fffdf0');
    // stars, and snow falling
    [[6, 5], [14, 9], [24, 4], [35, 8], [42, 3], [9, 20], [58, 26], [30, 16]].forEach(function (q) { px(q[0], q[1], 1, 1, '#ffffff'); });
    [[4, 30], [12, 24], [20, 34], [44, 30], [56, 36], [60, 18], [27, 27], [37, 22], [50, 41], [7, 41]].forEach(function (q) { px(q[0], q[1], 1, 1, 'rgba(255,255,255,0.85)'); });
    // a little fir on the hill, with lights
    for (var k = 0; k < 9; k++) { var hw2 = Math.floor(k * 0.6) + 1; px(8 - hw2, 33 + k, hw2 * 2, 1, k % 3 === 2 ? '#2a7a3c' : '#3a9a4a'); }
    px(7, 42, 2, 2, '#6a4422'); [[7, 36, '#ff5a6a'], [9, 39, '#ffd84a'], [6, 40, '#5ab4ff']].forEach(function (q) { px(q[0], q[1], 1, 1, q[2]); });
    px(7, 31, 2, 2, '#ffd84a');
    // the hill of snow behind him, with its sparkle
    for (var x = 0; x < 64; x++) {
      var top = 44 + Math.round(Math.sin(x * 0.1 + 0.4) * 3);
      px(x, top, 1, 64 - top, '#dce8f8'); px(x, top, 1, 1, '#ffffff');
      if (x % 7 === 3) px(x, top + 3, 1, 1, '#ffffff');
      px(x, top + 8, 1, 64 - top - 8, '#c4d4ec');
    }
    /* The three boys, close up, in Santa hats (Luke asked for all three, 29
       Oct): Beau in the middle, a little behind and taller (he's eight),
       Bonnie on the left and Winnie on the right, all from the game's own
       sprites, their shoulders running off the bottom edge */
    var kid = function (who, hx, y0, sc, fd) {
      fd = fd || 1;
      var s = A.player(who).b.idle, sp = BB.surface(s.w + 2, s.h + 2);
      BB.draw(sp.getContext('2d'), s, 1, 1);
      var x0 = hx - (1 + 10.75) * sc;
      g.drawImage(sp, Math.round(x0 * u), Math.round(y0 * u), Math.round((s.w + 2) * sc * u), Math.round((s.h + 2) * sc * u));
      // a Santa hat, as the game draws one (game.js drawHat), scaled with him
      var cx = hx, ty = y0 + 2 * sc, k2 = sc * 0.82;
      for (var i = 0; i < 8; i += 0.25) {
        var hw = Math.max(0.6, 6 - i * 0.68) * k2, flop = -fd * (i > 4 ? (i - 4) * (i - 4) * 0.42 : 0) * k2, yy = ty + (3.5 - i + (i > 5 ? (i - 5) * 0.55 : 0)) * k2;
        px(cx - hw + flop - 0.6, yy - 0.6, hw * 2 + 1.2, k2 * 0.25 + 0.6, '#2a1640');
        px(cx - hw + flop, yy, hw * 2, k2 * 0.25 + 0.3, i < 2 ? '#e8343c' : (Math.floor(i * 2) % 3 < 1 ? '#b81c2a' : '#e8343c'));
      }
      disc(Math.round(cx - fd * 7.6 * k2), Math.round(ty), Math.max(2, Math.round(1.9 * k2)), '#2a1640'); disc(Math.round(cx - fd * 7.6 * k2), Math.round(ty), Math.max(1, Math.round(1.45 * k2)), '#ffffff');
      px(cx - 7 * k2, ty + 3 * k2, 14 * k2, 3 * k2, '#2a1640'); px(cx - 6.5 * k2, ty + 3.4 * k2, 13 * k2, 2.1 * k2, '#ffffff'); px(cx - 6.5 * k2, ty + 5 * k2, 13 * k2, 0.5 * k2, '#dde2f2');
    };
    kid('beau', 32, 9, 1.7);
    kid('bonnie', 14.5, 17, 1.7);
    // (Winnie's hat flops the other way, so its bobble doesn't land on Beau's nose)
    kid('winnie', 49.5, 17.5, 1.7, -1);
    return c;
  };
  [512, 192, 180].forEach(function (n) {
    var c = paintIcon(n), f = document.createElement('figure'), a = document.createElement('a');
    c.style.width = Math.min(n, 256) + 'px';
    a.href = c.toDataURL('image/png'); a.download = 'icon-' + n + '.png'; a.textContent = 'icon-' + n + '.png';
    f.appendChild(c); f.appendChild(a); document.getElementById('out').appendChild(f);
  });
  window.iconData = function (n) { return paintIcon(n).toDataURL('image/png'); };
</script>
</body>
</html>
